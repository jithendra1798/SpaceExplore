[project]
name = "spaceexplore"
version = "0.1.0"
description = "Self-healing rover harness: an Explorer agent on a simulated planet and an Engineer agent that rewrites its harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pymongo>=4.8",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "voyageai>=0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
